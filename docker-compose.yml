version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: manan_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - manan_net
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"

  nginx:
    image: nginx:1.25-alpine
    container_name: manan_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - manan_net
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: manan_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: manan_invoice
      MYSQL_USER: manan
      MYSQL_PASSWORD: manan@2024
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - manan_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: manan_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - manan_net

networks:
  manan_net:
    driver: bridge

volumes:
  db_data:
  redis_data:
  vendor_data:
