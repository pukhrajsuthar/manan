version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: manan-furniture-app
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "Manan Furniture"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: manan_invoice
      DB_USERNAME: manan
      DB_PASSWORD: manan@2024
    depends_on:
      - mysql
    volumes:
      - .:/app
      - ./storage:/app/storage
    networks:
      - manan_net

  mysql:
    image: mysql:8.0
    container_name: manan-furniture-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: manan_invoice
      MYSQL_USER: manan
      MYSQL_PASSWORD: manan@2024
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - manan_net

networks:
  manan_net:
    driver: bridge

volumes:
  mysql_data:
